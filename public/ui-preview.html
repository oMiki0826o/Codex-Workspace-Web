<script>
const svg=(id,n=17)=>`<svg width="${n}" height="${n}"><use href="#i-${id}"/></svg>`;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const projects=[{id:'lowy',name:'LowYOutpostFinder',path:'/home/allen/LowYOutpostFinder',icon:'hex',color:''},{id:'discord',name:'Discord Bot',path:'/home/allen/discord-bot',icon:'code',color:'purple'},{id:'minecraft',name:'Minecraft Server',path:'/home/allen/minecraft',icon:'terminal',color:'amber'}];
const exampleThreads=[{id:'t-java',project:'lowy',title:'修復 Java 程式碼錯誤',time:'剛剛',isDemo:true},{id:'t-map',project:'lowy',title:'新增地圖搜尋功能',time:'1 小時前',isDemo:true},{id:'t-optim',project:'lowy',title:'優化效能與記憶體使用',time:'3 小時前',isDemo:true},{id:'t-discord',project:'discord',title:'改善 Discord 指令結構',time:'昨天',isDemo:true},{id:'t-server',project:'minecraft',title:'分析伺服器啟動紀錄',time:'昨天',isDemo:true}];
const seed=()=>[{role:'user',text:'幫我檢查這個專案的 Java 程式碼，修復目前的錯誤並優化效能，再執行測試確認沒有問題。',time:'14:23'},{role:'assistant',text:'正在檢查專案程式碼並分析問題…',steps:[{label:'讀取專案結構',state:'done',note:'完成 · 3.2s'},{label:'分析 Java 程式碼',state:'done',note:'完成 · 12.6s'},{label:'發現問題並修復',state:'running',note:'執行中 · 8.1s'},{label:'執行測試',state:'wait',note:'等待中'},{label:'優化效能',state:'wait',note:'等待中'},{label:'產生報告',state:'wait',note:'等待中'}],terminal:true,time:'14:23'}];
let state={project:'lowy',thread:'t-java',tab:'files',file:'Main.java',settings:{model:'預設模型',effort:'Medium',sandbox:'workspace-write'},messages:seed(),running:false,demoTimer:null};
let threadMessages={'t-java':seed()};
function currentProject(){return projects.find(x=>x.id===state.project)||projects[0]}
function renderProjects(){document.getElementById('projects').innerHTML=projects.map(p=>`<button class="project-item ${state.project===p.id?'selected':''}" onclick="selectProject('${p.id}')"><span class="project-icon ${p.color}">${svg(p.icon,19)}</span><span class="project-info"><div class="project-name">${escapeHtml(p.name)}</div><div class="project-path">${escapeHtml(p.path)}</div></span></button>`).join('')}
function renderThreads(){let items=exampleThreads.filter(t=>t.project===state.project);document.getElementById('threads').innerHTML=items.map(t=>`<button class="thread ${t.id===state.thread?'selected':''}" onclick="selectThread('${t.id}')">${svg('chat',15)}<span class="thread-label">${escapeHtml(t.title)}</span>${t.id===state.thread?'<span class="unread"></span>':''}</button>`).join('')||'<div style="color:var(--muted2);font-size:12px;padding:12px">此專案還沒有對話</div>'}
function renderHeader(){const p=currentProject();document.getElementById('project-title').textContent=p.name;document.getElementById('project-location').textContent=p.path}
function renderChat(){const root=document.getElementById('chat-content');if(!state.messages.length){root.innerHTML=`<div class="empty"><div class="empty-icon">${svg('hex',28)}</div><h2>今天要處理什麼專案？</h2><p>選擇專案後輸入指令，Codex 就能分析程式碼、修復問題或協助測試。此預覽只展示介面與模擬互動。</p><div class="quick-actions"><button class="quick-prompt" onclick="quickPrompt('檢查目前專案的結構並整理改善建議')">檢查專案結構並整理改善建議　↗</button><button class="quick-prompt" onclick="quickPrompt('幫我分析測試失敗的原因')">分析測試失敗原因　↗</button><button class="quick-prompt" onclick="quickPrompt('幫我找出可能的效能瓶頸')">尋找可能的效能瓶頸　↗</button></div></div>`;return}
root.innerHTML=state.messages.map(m=>{if(m.role==='user')return `<article class="msg"><div class="msg-avatar user">A</div><div class="msg-area"><div class="msg-author">你 <span class="msg-time">${m.time||'現在'}</span></div><div class="user-bubble">${escapeHtml(m.text)}</div></div></article>`;
let steps=m.steps?`<div class="steps">${m.steps.map(s=>`<div class="step ${s.state}"><span class="step-icon">${s.state==='done'?'✓':s.state==='running'?'●':''}</span><span class="step-label">${escapeHtml(s.label)}</span><span class="step-note">${escapeHtml(s.note)}</span></div>`).join('')}</div>`:'';
let terminal=m.terminal?`<div class="terminal-card"><div class="terminal-head"><span>${svg('terminal',15)}　執行命令（示範）</span><button class="copy" onclick="copyCommand()">${svg('copy',14)}複製</button></div><div class="terminal-command">⌄　./gradlew test</div><div class="terminal-out"><span class="purple">&gt; Task :compileJava</span>\n<span class="purple">&gt; Task :processResources</span>\n<span class="purple">&gt; Task :classes</span>\n<span class="purple">&gt; Task :testClasses</span>\n\n<span class="blue">&gt; Task :test</span>\nRunning tests...\n</div><div class="progress-wrap"><div class="progress-track"><div class="progress-bar"></div></div><span class="progress-detail">3/12 tests (25%)</span></div></div>`:'';
return `<article class="msg"><div class="msg-avatar">${svg('hex',22)}</div><div class="msg-area"><div class="msg-author">Codex <span class="msg-time">${m.time||'現在'}</span></div><div class="assistant-intro">${escapeHtml(m.text)}</div>${steps}${terminal}${m.note?`<div class="note-block">${escapeHtml(m.note)}</div>`:''}</div></article>`}).join('');}
function renderRight(){document.querySelectorAll('[data-right]').forEach(el=>el.classList.toggle('active',el.dataset.right===state.tab));const root=document.getElementById('right-body');if(state.tab==='files'){root.innerHTML=`<div class="tree-title">${svg('folder',15)}${escapeHtml(currentProject().name)}</div><div>${[['.git',0,'folder'],['.gradle',0,'folder'],['build',0,'folder'],['src',0,'folder'],['main',1,'folder'],['java',2,'folder'],['com',3,'folder'],['lowy',4,'folder'],['outpostfinder',5,'folder'],['Main.java',6,'file'],['OutpostFinder.java',6,'file'],['MapAnalyzer.java',6,'file'],['Config.java',6,'file'],['resources',2,'folder'],['test',1,'folder'],['build.gradle',0,'file']].map(([name,depth,type])=>`<button class="tree-row ${state.file===name?'selected':''}" onclick="selectFile('${name}')"><span class="tree-indent" style="--indent:${depth*13}px"></span>${type==='folder'?`<span class="folder-dot">${svg('folder',14)}</span>`:`<span class="file-dot">${name.endsWith('.java')?'J':'G'}</span>`}<span>${name}</span></button>`).join('')}</div><div class="right-divider"></div>${diffMarkup()}`}
else if(state.tab==='changes'){root.innerHTML=`<div class="right-h2"><span>變更檔案 <span style="color:var(--muted2)">(2)</span></span><span class="delta"><span class="plus">+12</span>　<span class="minus">−3</span></span></div><div class="changes-list"><button class="change-file" onclick="setRightTab('files');selectFile('Main.java')"><span class="file-dot">J</span><span class="change-name">Main.java</span><span class="plus">+8</span><span class="minus">−2</span></button><button class="change-file" onclick="setRightTab('files');selectFile('OutpostFinder.java')"><span class="file-dot">J</span><span class="change-name">OutpostFinder.java</span><span class="plus">+4</span><span class="minus">−1</span></button></div><div class="right-divider"></div>${diffMarkup()}`}
else {root.innerHTML=`<div class="right-h2">終端輸出（示範）</div><div class="terminal-panel">$ ./gradlew test\n\n> Task :compileJava\n> Task :processResources\n> Task :classes\n> Task :testClasses\n\n> Task :test\nRunning tests...\n\nBUILD IN PROGRESS\n\n此內容為範例輸出；正式版將顯示 Codex JSONL 事件。</div>`}}
function diffMarkup(){return `<div class="right-h2"><span>差異預覽</span><span class="delta"><span class="plus">+12</span>　<span class="minus">−3</span></span></div><div class="diff"><div class="diff-header"><span>📄　${escapeHtml(state.file.endsWith('.java')?state.file:'Main.java')}</span><span>範例 diff</span></div><div class="diff-code"><span class="diff-line meta">@@ -10,4 +10,5 @@</span><span class="diff-line">  public class Main {</span><span class="diff-line del">-   static int radius = 128;</span><span class="diff-line add">+   static int radius = 256;</span><span class="diff-line">    public static void main(</span><span class="diff-line add">+     initializeLogger();</span><span class="diff-line">      Config.load();</span><span class="diff-line">    }</span><span class="diff-line">  }</span></div></div>`}
function renderControls(){document.getElementById('model-label').textContent=state.settings.model;document.getElementById('effort-label').textContent=state.settings.effort;document.getElementById('sandbox-label').textContent=state.settings.sandbox;let b=document.getElementById('send-btn');b.innerHTML=svg(state.running?'stop':'send',17);b.classList.toggle('stop',state.running);b.title=state.running?'停止示範':'傳送示範訊息'}
function render(){renderProjects();renderThreads();renderHeader();renderChat();renderRight();renderControls()}
function selectProject(id){if(state.running)stopRun();state.project=id;let t=exampleThreads.find(t=>t.project===id);state.thread=t?t.id:null;state.messages=state.thread?(threadMessages[state.thread]||[]).map(m=>({...m})):[];render();toggleSidebar(false)}
function selectThread(id){if(state.running)stopRun();state.thread=id;state.messages=(threadMessages[id]||((id==='t-java')?seed():[{role:'assistant',text:'這是工作階段介面範例。連接 Codex CLI 後，可在此恢復真正的對話記錄。',time:'展示'}])).map(m=>({...m}));render();toggleSidebar(false)}
function newThread(){if(state.running)stopRun();const id='t-'+Date.now();exampleThreads.unshift({id,project:state.project,title:'新的對話',time:'現在'});state.thread=id;state.messages=[];threadMessages[id]=[];render();toggleSidebar(false);document.getElementById('prompt').focus()}
function setRightTab(tab){state.tab=tab;renderRight();document.getElementById('right-panel').classList.add('open')}
function selectFile(file){state.file=file;renderRight()}
function toggleSidebar(force){document.getElementById('sidebar').classList.toggle('open',typeof force==='boolean'?force:undefined);document.getElementById('scrim').classList.toggle('active',document.getElementById('sidebar').classList.contains('open'))}
function toggleRight(force){const p=document.getElementById('right-panel');p.classList.toggle('open',typeof force==='boolean'?force:!p.classList.contains('open'));document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('active')}
function closeOverlays(){toggleSidebar(false);toggleRight(false)}
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';safeSetTheme(document.documentElement.dataset.theme)}
function toast(msg){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast" role="status">${escapeHtml(msg)}</div>`;setTimeout(()=>root.innerHTML='',3200)}
function copyCommand(){if(navigator.clipboard?.writeText){navigator.clipboard.writeText('./gradlew test').then(()=>toast('已複製示範指令')).catch(()=>toast('無法存取剪貼簿'))}else toast('目前環境不支援剪貼簿')}
function quickPrompt(txt){document.getElementById('prompt').value=txt;document.getElementById('prompt').focus()}
function openSettings(){let s=state.settings;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="closeModal(event)"><div class="modal" role="dialog" aria-modal="true" aria-label="設定"><div class="modal-title"><h2>設定</h2><button class="icon-btn" onclick="closeModal()">${svg('close',19)}</button></div><div class="form-field"><div class="form-label">Codex 模型</div><select class="select" onchange="setSetting('model',this.value)">${['預設模型','gpt-5-codex','由 Codex CLI 決定'].map(x=>`<option ${x===s.model?'selected':''}>${x}</option>`).join('')}</select><div class="form-help">目前僅示範控制項。正式版從 Codex CLI 支援選項讀取。</div></div><div class="form-field"><div class="form-label">推理強度</div><select class="select" onchange="setSetting('effort',this.value)">${['Low','Medium','High','Extra High'].map(x=>`<option ${x===s.effort?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-field"><div class="form-label">Sandbox 權限</div><select class="select" onchange="setSetting('sandbox',this.value)">${['read-only','workspace-write'].map(x=>`<option ${x===s.sandbox?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-field"><div class="form-label">外觀</div><button class="outline-btn" onclick="toggleTheme()">${svg('sun',15)}　切換深色 / 淺色模式</button></div><div class="modal-footer">Codex WebUI v0.1 · 前端展示版本<br>本畫面不會修改 Ubuntu Codex 設定，也不會執行 CLI 指令。</div></div></div>`}
function setSetting(key,val){state.settings[key]=val;renderControls()}
function closeModal(e){if(!e||e.target.classList.contains('modal-backdrop'))document.getElementById('modal-root').innerHTML=''}
function openSearch(){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop shortcut-backdrop" onclick="closeModal(event)"><div class="modal search-modal" role="dialog" aria-modal="true"><div class="search-box">${svg('search',19)}<input id="search-input" autofocus placeholder="搜尋專案、對話或檔案..." oninput="renderSearch(this.value)"/><span class="keycap">ESC</span></div><div id="search-results" style="padding:7px 0;max-height:360px;overflow:auto"></div></div></div>`;renderSearch('');requestAnimationFrame(()=>document.getElementById('search-input')?.focus())}
function renderSearch(q){const root=document.getElementById('search-results');if(!root)return;let candidates=[...projects.map(p=>({...p,kind:'project',label:p.name,sub:p.path})),...exampleThreads.map(t=>({...t,kind:'thread',label:t.title,sub:'對話 · '+(projects.find(p=>p.id===t.project)?.name||'')}))].filter(x=>(x.label+' '+x.sub).toLowerCase().includes(q.toLowerCase())).slice(0,12);root.innerHTML=candidates.map(x=>`<button class="search-result" onclick="searchSelect('${x.kind}','${x.id}')">${svg(x.kind==='project'?'folder':'chat',19)}<span><strong>${escapeHtml(x.label)}</strong><small>${escapeHtml(x.sub)}</small></span></button>`).join('')||'<div style="padding:18px;color:var(--muted)">找不到結果</div>'}
function searchSelect(kind,id){closeModal();if(kind==='project')selectProject(id);else{const t=exampleThreads.find(t=>t.id===id);if(t){selectProject(t.project);selectThread(id)}}}
function stopRun(){if(state.demoTimer)clearTimeout(state.demoTimer);state.running=false;state.demoTimer=null;let last=state.messages[state.messages.length-1];if(last?.role==='assistant'){last.text='示範執行已停止。';last.steps=null;last.terminal=false;last.note='正式版將發送取消訊號至對應的 Codex 執行程序。'}render();toast('已停止示範執行')}
function sendPrompt(e){e.preventDefault();if(state.running){stopRun();return}let el=document.getElementById('prompt');let value=el.value.trim();if(!value)return;if(!state.thread)newThread();state.messages.push({role:'user',text:value,time:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})});state.messages.push({role:'assistant',text:'正在準備工作環境（介面示範）…',time:'現在',steps:[{label:'接收訊息',state:'done',note:'完成'},{label:'分析工作要求',state:'running',note:'執行中'},{label:'產生執行摘要',state:'wait',note:'等待中'}]});state.running=true;el.value='';const t=exampleThreads.find(t=>t.id===state.thread);if(t&&t.title==='新的對話')t.title=value.length>21?value.slice(0,21)+'…':value;threadMessages[state.thread]=state.messages;render();scrollToBottom();state.demoTimer=setTimeout(()=>{if(!state.running)return;let last=state.messages[state.messages.length-1];last.text='已收到你的要求。這是 Codex WebUI 的可互動介面預覽；正式連線後，這個區域會即時顯示 codex exec --json 的回覆、工具呼叫與測試輸出。';last.steps=[{label:'接收訊息',state:'done',note:'完成'},{label:'分析工作要求',state:'done',note:'完成'},{label:'產生執行摘要',state:'done',note:'完成'}];last.note='目前並未在 Ubuntu 上執行 Codex。';state.running=false;state.demoTimer=null;render();scrollToBottom()},1450)}
function scrollToBottom(){requestAnimationFrame(()=>{const s=document.getElementById('chat-scroll');s.scrollTop=s.scrollHeight})}
document.getElementById('prompt-form').addEventListener('submit',sendPrompt);
document.getElementById('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendPrompt(e)}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){document.getElementById('modal-root').innerHTML='';closeOverlays()}});
function safeSetTheme(value){try{localStorage.setItem('codex-ui-theme',value)}catch(_){}}
let theme=null;try{theme=localStorage.getItem('codex-ui-theme')}catch(_){};if(theme==='light')document.documentElement.dataset.theme='light';
render();
</script>
</body>
</html>
